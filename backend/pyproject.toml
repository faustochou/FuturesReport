[project]
name = "futuresreport-backend"
version = "0.1.0"
description = "FuturesReport - 未來學 AI 多智能體模擬引擎"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Nexora" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # 数据库
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # PostgreSQL driver (production); also usable for dev if Postgres is available
    "psycopg2-binary>=2.9.0",

    # LLM 相关
    "openai>=1.0.0",

    # 金流
    "stripe>=10.0.0",
    "cryptography>=42.0.0",

    # Graphiti + FalkorDB（取代 Zep Cloud 的圖譜引擎；BYOK 動態組裝 LLM/embedder，
    # 見 app/services/graphiti_factory.py）。google-genai 用於原生 Gemini LLM/embedder。
    # 已知依賴衝突：graphiti-core[falkordb] 會把 neo4j 拉到 6.2.0，
    # 但下面 camel-oasis==0.2.5 鎖定 neo4j==5.23.0。經驗證 `import oasis`/`import camel`
    # 在 neo4j 6.2.0 下仍正常（camel-oasis 的 neo4j 依賴是其內建的替代圖儲存後端，
    # 本專案的模擬引擎並未使用該路徑）。刻意保留 6.2.0（不鎖回 5.23.0），並在
    # backend/tests/ 增加 camel-oasis 煙霧測試覆蓋。日後升級 camel-oasis 版本時
    # 需重新確認此 override 是否仍然安全。
    "graphiti-core[falkordb,google-genai]>=0.29.0",

    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # 低资源监控 (K3s / 小型 VPS)
    "psutil>=5.9.0",
    # Background task queue (Celery + Redis) for moving heavy simulation out of main API
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[tool.uv]
# camel-oasis==0.2.5 硬鎖 neo4j==5.23.0，但 graphiti-core[falkordb]>=0.29.0 需要
# neo4j>=5.26.0；uv 的解析器（跟 pip 不同）在這個宣告衝突上會直接拒絕產生 lockfile。
# 見上方 dependencies 區塊 graphiti-core 那一行的完整衝突說明與煙霧測試佐證——
# 已驗證 neo4j 6.2.0 下 camel-oasis 的 import/實際模擬路徑都正常（其 neo4j 依賴是
# 內建替代圖儲存後端，本專案未使用）。這裡用 override 強制解析結果採用 6.2.0，
# 對應 backend/tests/test_camel_oasis_smoke.py 的驗證基準。
override-dependencies = ["neo4j>=5.26.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
